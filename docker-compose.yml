services:
  postgres:
    image: postgres:16-alpine
    container_name: docanalyzer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docanalyzer
      POSTGRES_PASSWORD: docanalyzer
      POSTGRES_DB: docanalyzer
    ports:
      - "5434:5432"
    volumes:
      - docanalyzer-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: docanalyzer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - docanalyzer-redis-data:/data

volumes:
  docanalyzer-postgres-data:
  docanalyzer-redis-data:
